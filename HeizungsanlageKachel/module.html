<!-- Layout und Farben kommen aus „Visu Design“ (W5D_GetCSS + W5D_GetTileCSS, Bausteine laut README, ab 1.7).
     Hier nur Sonderelemente (Zustandsplakette, Messwerte, Verlaufsdiagramm), ausschließlich mit Farben aus Visu Design
     (Vorlauf --w5t-hot, Rücklauf --w5t-cold, Warmwasser --w5t-warm). -->
<style>
/* Kopf: Zustand links, Außentemperatur rechts */
#ha .head { align-items: center; gap: 10px; }
#ha .state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: var(--w5t-bg2); min-width: 0; max-width: 70%; }
#ha .state span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#ha .state svg { width: 16px; height: 16px; flex: none; }
#ha .state.burn, #ha .state.burn span { color: var(--w5t-hot); }
#ha .state.dhw, #ha .state.dhw span { color: var(--w5t-warm); }
#ha .state.alarm { background: var(--w5t-bad); }
#ha .state.alarm, #ha .state.alarm span { color: var(--w5t-on); }
#ha .state.burn svg, #ha .state.dhw svg { animation: w5tp 1.6s ease-in-out infinite; }
#ha .at { text-align: right; white-space: nowrap; font-size: 20px; }
/* Messwerte */
#ha .mets { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 8px; }
#ha .m { background: var(--w5t-bg); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-top: 3px solid var(--c, transparent); }
#ha .m .v { font-size: 28px; font-weight: 300; line-height: 1.1; white-space: nowrap; }
#ha .m .v small { font-size: 14px; margin-left: 1px; }
#ha .m .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Meldungen */
#ha .al { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
#ha .al b { font-weight: 600; }
#ha .al .sub { white-space: nowrap; }
/* Verlauf */
#ha .nav { display: flex; align-items: center; gap: 8px; }
#ha .when { flex: 1; text-align: center; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ha .live { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--w5t-accent); padding: 0 6px; }
#ha .plot { position: relative; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; min-height: 130px; }
#ha .plot:active { cursor: grabbing; }
#ha .plot .load { height: 130px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--w5t-muted); }
#ha .chart svg { width: 100%; height: 130px; touch-action: pan-y; display: block; overflow: visible; }
#ha .chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
#ha .chart .gl { stroke: var(--w5t-line); stroke-width: 1; }
#ha .chart .dl { stroke-dasharray: 3 3; }
#ha .chart .ch { fill: var(--w5t-warm); opacity: .18; }
#ha .chart .cur { stroke: var(--w5t-fg); stroke-width: 1; opacity: .5; }
#ha .yl { position: absolute; top: 0; bottom: 0; right: 2px; display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; pointer-events: none; }
#ha .yl span { color: var(--w5t-muted); }
#ha .tip { position: absolute; top: -6px; display: none; flex-wrap: wrap; gap: 2px 10px; max-width: 100%; font-size: 11px; padding: 5px 8px; border-radius: 8px; background: var(--w5t-bg2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; box-shadow: 0 1px 4px var(--w5t-shadow); }
#ha .tip b { width: 100%; font-weight: 600; }
#ha .tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
#ha .ax { font-size: 10px; display: flex; justify-content: space-between; line-height: 1.25; }
#ha .ax span { text-align: center; color: var(--w5t-muted); }
#ha .ax span:first-child { text-align: left; }
#ha .ax span:last-child { text-align: right; }
#ha .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; }
#ha .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
#ha .facts { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 14px; text-align: left; white-space: normal; }
/* Schalten: Stufen mit − / + */
#ha .stp { display: inline-flex; align-items: center; gap: 6px; flex: none; }
#ha .stp .v { min-width: 64px; text-align: center; font-size: 18px; font-weight: 500; }
#ha .row .seg { flex: none; }
@media (max-width: 420px) {
  #ha .m { padding: 8px 10px; }
  #ha .m .v { font-size: 23px; }
}
/* kleine Kachel: nur Kopf, Messwerte und Meldungen */
body.compact #ha .m .v { font-size: 22px; }
body.compact #ha .card { display: none; }
body.compact #ha .card.alarm { display: flex; }
</style>
<div id="ha" class="w5t fill"></div>
<script>
var HA = { s: null, ask: null, askT: 0 };
var ICON = {
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 1.7s.7 2.6.7 4.7c0 2-1.3 3.6-3.3 3.6S7.5 8.4 7.5 6.4l.03-.36C5.5 8.5 4.3 11.6 4.3 15c0 4.4 3.6 8 8 8s8-3.6 8-8C20.3 9.6 17.7 4.8 13.5 1.7zM12 20c-1.8 0-3.2-1.4-3.2-3.1 0-1.6 1-2.8 2.8-3.1 1.8-.4 3.6-1.2 4.6-2.6.4 1.3.6 2.7.6 4.1C16.8 17.9 14.6 20 12 20z"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.7c-.3 0-.6.1-.8.4C9 6 5 11.2 5 14.9 5 18.8 8.1 22 12 22s7-3.2 7-7.1c0-3.7-4-8.9-6.2-11.8-.2-.3-.5-.4-.8-.4z"/></svg>',
  pump: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>',
  idle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>'
};
var SICON = { burn: 'flame', dhw: 'drop', pump: 'pump', alarm: 'alert', idle: 'idle' };

function design(css) {
  if (typeof css !== 'string') return;
  var st = document.getElementById('w5d');
  if (!st) { st = document.createElement('style'); st.id = 'w5d'; (document.head || document.body).appendChild(st); }
  if (st.textContent !== css) st.textContent = css;
}
function handleMessage(data) {
  var m;
  try { m = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { return; }
  if (m && m.type === 'hist') {            // Antwort auf eine Verlaufsanfrage, nur die eigene übernehmen
    if (m.id !== HA.v.req) return;
    HA.v.data = m;
  } else {
    HA.s = m;
    design(HA.s.design);
    var t = (HA.s.hist || {}).t || 0;
    if (t !== HA.v.histT) { var first = HA.v.histT === 0; HA.v.histT = t; if (!first && HA.v.end === null && !isLive24()) load(); }
  }
  if (HA.v.drag) { HA.v.pending = true; return; }
  render();
}
function fmt(v, d) {
  if (v === null || v === undefined || isNaN(v)) return '–';
  return Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function clock(ts) { var d = new Date(ts * 1000); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function since(ts) {
  var d = new Date(ts * 1000), n = new Date();
  return (d.toDateString() === n.toDateString() ? 'seit ' : 'seit ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '. ') + clock(ts);
}
function send(ident, value) { if (typeof requestAction === 'function') requestAction(ident, value); }

/* Hell/Dunkel übernimmt W5D_GetTileJS (w5tTheme); ohne Design-Modul bleibt der helle Modus */
function theme() { if (typeof w5tTheme === 'function') w5tTheme(); }

function metric(lbl, v, sub, color) {
  return '<div class="m" style="--c:' + color + '"><div class="lbl">' + lbl + '</div><div class="v num">' + fmt(v, 1) + '<small>°</small></div><div class="sub">' + (sub || '&nbsp;') + '</div></div>';
}

/* ---------- Verlauf: verschiebbar, Zeitraum wählbar, Werte mit Datum und Uhrzeit ---------- */
var WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
var SPANS = [[21600, '6 h'], [86400, '24 h'], [259200, '3 T'], [604800, '7 T']];
var COL = { vl: 'var(--w5t-hot)', rl: 'var(--w5t-cold)', ww: 'var(--w5t-warm)' }, NAME = { vl: 'Vorlauf', rl: 'Rücklauf', ww: 'Warmwasser' };
// end null = live (bis jetzt); data = Antwort auf die eigene Anfrage (req)
HA.v = { end: null, span: 86400, data: null, req: null, histT: 0, drag: null, pending: false };

function nowS() { return Math.floor(Date.now() / 1000); }
function dt(ts, withDay) { var d = new Date(ts * 1000); return (withDay ? WD[d.getDay()] + ' ' : '') + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '. ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function isLive24() { return HA.v.end === null && HA.v.span === 86400; }
function viewEnd() { return HA.v.end === null ? nowS() : HA.v.end; }
function load() {
  var id = Math.random().toString(36).slice(2, 10), to = viewEnd();
  HA.v.req = id; HA.v.data = null;
  send('History', JSON.stringify({ id: id, from: to - HA.v.span, to: to }));
}
function chartData() {
  if (isLive24()) { var h = HA.s.hist || {}; return { from: (h.t || nowS()) - 86400, to: h.t || nowS(), series: h.series || {}, chargeTimes: h.chargeTimes || [] }; }
  return HA.v.data;
}
function setView(end, span) {
  if (span) HA.v.span = span;
  if (end !== null && end >= nowS() - 120) end = null;   // bis jetzt = live
  HA.v.end = end;
  if (!isLive24()) load(); else HA.v.data = null;
  render();
}

function chartCard(facts) {
  var d = chartData(), fx = facts.length ? '<div class="facts"><span>' + facts.join('</span><span>') + '</span></div>' : '';
  var se = d ? d.series || {} : {}, keys = ['vl', 'rl', 'ww'].filter(function (k) { return se[k] && se[k].length > 1; });
  if (d && !keys.length && isLive24()) return fx ? '<div class="card">' + fx + '</div>' : '';
  var to = d ? d.to : viewEnd(), from = d ? d.from : to - HA.v.span, span = to - from;
  var h = '<div class="card chart"><div class="row"><span class="lbl">Verlauf</span><span class="seg sm">';
  SPANS.forEach(function (x) { h += '<button class="' + (HA.v.span === x[0] ? 'on' : '') + '" data-span="' + x[0] + '">' + x[1] + '</button>'; });
  h += '</span></div><div class="nav"><button class="ib plain sm" data-nav="-1" aria-label="zurück">‹</button><span class="when num" id="rng">' + dt(from, true) + ' – ' + dt(to, false) + '</span>'
    + '<button class="ib plain sm" data-nav="1" aria-label="vor"' + (HA.v.end === null ? ' disabled' : '') + '>›</button>'
    + (HA.v.end === null ? '<span class="live">live</span>' : '<button class="btn acc sm" data-nav="0">Jetzt</button>') + '</div>';
  h += '<div class="plot" id="plot">';
  if (!d) h += '<div class="load">lädt …</div>';
  else if (!keys.length) h += '<div class="load">keine Daten im Zeitraum</div>';
  else {
    var lo = 1e9, hi = -1e9;
    keys.forEach(function (k) { se[k].forEach(function (p) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }); });
    lo = Math.floor(lo / 5) * 5; hi = Math.ceil(hi / 5) * 5; if (hi - lo < 10) hi = lo + 10;
    var W = 300, H = 120, x = function (t) { return ((t - from) / span * W).toFixed(2); }, y = function (v) { return (H - (v - lo) / (hi - lo) * H).toFixed(1); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
    for (var g = 0; g <= 4; g++) svg += '<line class="gl" x1="0" x2="' + W + '" y1="' + (H * g / 4) + '" y2="' + (H * g / 4) + '" vector-effect="non-scaling-stroke"/>';
    svg += '<g id="pl">';
    // Tageswechsel als senkrechte Linie
    var md = new Date(from * 1000); md.setHours(24, 0, 0, 0);
    for (var t = md.getTime() / 1000; t < to; t += 86400) svg += '<line class="gl dl" x1="' + x(t) + '" x2="' + x(t) + '" y1="0" y2="' + H + '" vector-effect="non-scaling-stroke"/>';
    (d.chargeTimes || []).forEach(function (t) { svg += '<rect class="ch" x="' + x(t) + '" y="0" width="' + Math.max(0.6, W * 900 / span).toFixed(2) + '" height="' + H + '"/>'; });
    keys.forEach(function (k) {
      svg += '<polyline class="ln" points="' + se[k].map(function (p) { return x(p[0]) + ',' + y(p[1]); }).join(' ') + '" stroke="' + COL[k] + '" vector-effect="non-scaling-stroke"' + (k === 'ww' ? ' stroke-dasharray="4 3"' : '') + '/>';
    });
    svg += '</g><line id="cur" class="cur" style="display:none" x1="0" x2="0" y1="0" y2="' + H + '" vector-effect="non-scaling-stroke"/></svg>';
    h += svg + '<div class="yl"><span>' + hi + '°</span><span>' + lo + '°</span></div><div class="tip" id="tip"></div>';
    HA.v.plot = { from: from, to: to, se: se, keys: keys };
  }
  h += '</div><div class="ax">';
  for (var i = 0; i <= 4; i++) { var ts = from + span * i / 4, dd = new Date(ts * 1000); h += '<span>' + WD[dd.getDay()] + ' ' + pad(dd.getDate()) + '.' + pad(dd.getMonth() + 1) + '.<br>' + pad(dd.getHours()) + ':' + pad(dd.getMinutes()) + '</span>'; }
  h += '</div><div class="legend">';
  keys.forEach(function (k) { h += '<span><i style="background:' + COL[k] + '"></i>' + NAME[k] + '</span>'; });
  if (d && (d.chargeTimes || []).length) h += '<span><i style="background:var(--w5t-warm);opacity:.4;height:10px"></i>WW-Ladung</span>';
  return h + '</div>' + fx + '</div>';
}

/* Werte am Zeitpunkt der Zeigerposition */
function tip(px) {
  var P = HA.v.plot, el = document.getElementById('plot'), tp = document.getElementById('tip'), cur = document.getElementById('cur');
  if (!P || !el || !tp) return;
  var r = el.getBoundingClientRect(), f = Math.max(0, Math.min(1, (px - r.left) / r.width)), t = P.from + f * (P.to - P.from), txt = '<b>' + dt(t, true) + '</b>';
  P.keys.forEach(function (k) {
    var best = null; P.se[k].forEach(function (p) { if (best === null || Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p; });
    if (best) txt += '<span><i style="background:' + COL[k] + '"></i>' + NAME[k] + ' ' + fmt(best[1], 1) + '°</span>';
  });
  tp.innerHTML = txt; tp.style.display = 'flex';
  tp.style.left = Math.min(Math.max(0, f * r.width - tp.offsetWidth / 2), r.width - tp.offsetWidth) + 'px';
  cur.setAttribute('x1', (f * 300).toFixed(2)); cur.setAttribute('x2', (f * 300).toFixed(2)); cur.style.display = '';
}
function untip() { var tp = document.getElementById('tip'), cur = document.getElementById('cur'); if (tp) tp.style.display = 'none'; if (cur) cur.style.display = 'none'; }

function bindChart() {
  document.querySelectorAll('#ha [data-span]').forEach(function (b) {
    b.onclick = function () { var sp = Number(b.dataset.span); setView(HA.v.end === null ? null : HA.v.end, sp); };
  });
  document.querySelectorAll('#ha [data-nav]').forEach(function (b) {
    b.onclick = function () { var n = Number(b.dataset.nav); if (n === 0) setView(null); else setView(viewEnd() + n * HA.v.span / 2); };
  });
  var pl = document.getElementById('plot');
  if (!pl || !HA.v.plot) return;
  pl.addEventListener('pointerdown', function (e) {
    HA.v.drag = { x: e.clientX, end: HA.v.plot.to, w: pl.getBoundingClientRect().width, moved: false, id: e.pointerId };
    try { pl.setPointerCapture(e.pointerId); } catch (x) { /* */ }
  });
  pl.addEventListener('pointermove', function (e) {
    var D = HA.v.drag;
    if (!D) { if (e.pointerType === 'mouse') tip(e.clientX); return; }
    var dx = e.clientX - D.x;
    if (!D.moved && Math.abs(dx) < 8) return;
    D.moved = true; untip();
    var span = HA.v.plot.to - HA.v.plot.from, end = Math.min(nowS(), D.end - dx / D.w * span);
    dx = (D.end - end) / span * D.w;   // nicht über „jetzt“ hinaus
    document.getElementById('pl').setAttribute('transform', 'translate(' + (dx / D.w * 300).toFixed(2) + ',0)');
    document.getElementById('rng').textContent = dt(end - span, true) + ' – ' + dt(end, false);
  });
  function up(e) {
    var D = HA.v.drag; HA.v.drag = null;
    if (!D) return;
    if (!D.moved) { tip(e.clientX); return; }
    var span = HA.v.plot.to - HA.v.plot.from;
    setView(Math.round(Math.min(nowS(), D.end - (e.clientX - D.x) / D.w * span)));
  }
  pl.addEventListener('pointerup', up);
  pl.addEventListener('pointercancel', function () { HA.v.drag = null; render(); });
  pl.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !HA.v.drag) untip(); });
}

function ctlHtml(c, grouped) {
  if (!c.ok) return '';
  var ask = HA.ask === c.i, cls = ask ? ' ask' : '';
  if (c.type === 'toggle') return '<button class="tg' + (c.on ? ' on' : '') + cls + '" data-i="' + c.i + '" aria-label="' + esc(c.t) + '"></button>';
  if (c.type === 'button') return grouped
    ? '<button class="' + (c.on ? 'on' : '') + cls + '" data-i="' + c.i + '">' + esc(c.t) + '</button>'
    : '<button class="btn acc' + (c.on ? ' solid' : '') + cls + '" data-i="' + c.i + '">' + (ask ? 'Bestätigen' : 'Start') + '</button>';
  if (c.type === 'step') return '<span class="stp"><button class="ib plain" data-i="' + c.i + '" data-d="-1" aria-label="' + esc(c.t) + ' senken">−</button><span class="v num">' + esc(c.v) + '</span><button class="ib plain" data-i="' + c.i + '" data-d="1" aria-label="' + esc(c.t) + ' erhöhen">+</button></span>';
  return '';
}

function render() {
  var s = HA.s, el = document.getElementById('ha');
  if (!s) return;
  theme();
  document.body.classList.toggle('compact', window.innerHeight < 330);
  var st = s.state || { k: 'idle', t: '' }, hi = s.hist || {}, h = '';

  h += '<div class="head"><div class="state ' + st.k + '">' + ICON[SICON[st.k] || 'idle'] + '<span>' + esc(st.t) + '</span></div>';
  if (s.at !== null) h += '<div class="at num"><div class="lbl">Außen</div>' + fmt(s.at, 1) + '°</div>';
  h += '</div>';

  var ms = [];
  if (s.vl !== null) ms.push(metric('Vorlauf', s.vl, s.vlSoll !== null ? 'Soll ' + fmt(s.vlSoll, 0) + '°' : '', COL.vl));
  if (s.rl !== null) ms.push(metric('Rücklauf', s.rl, s.vl !== null ? 'Δ ' + fmt(s.vl - s.rl, 1) + ' K' : '', COL.rl));
  if (s.ww !== null) ms.push(metric('Warmwasser', s.ww, s.wwSoll !== null ? 'Soll ' + fmt(s.wwSoll, 0) + '°' : '', COL.ww));
  if (ms.length) h += '<div class="mets" style="--n:' + ms.length + '">' + ms.join('') + '</div>';

  if ((s.alarms || []).length) {
    h += '<div class="card alarm"><div class="lbl">Meldungen</div>';
    s.alarms.forEach(function (a) { h += '<div class="al"><b class="bad">' + esc(a.t) + '</b><span class="sub">' + since(a.since) + '</span></div>'; });
    if (st.x) h += '<div class="hint">' + esc(st.x) + '</div>';
    h += '</div>';
  }

  var f = [];
  if (hi.gas !== null && hi.gas !== undefined) f.push('Gas heute <b>' + fmt(hi.gas, 2) + ' m³</b>' + (s.gasFactor > 0 ? ' · ' + fmt(hi.gas * s.gasFactor, 1) + ' kWh' : ''));
  if (hi.charges !== null && hi.charges !== undefined) f.push('WW-Ladungen heute <b>' + hi.charges + '</b>');
  h += chartCard(f);

  var cs = (s.controls || []).filter(function (c) { return c.ok; });
  if (cs.length) {
    h += '<div class="card"><div class="lbl">Schalten</div>';
    var done = {};
    cs.forEach(function (c) {
      if (c.g && c.type === 'button') {
        if (done[c.g]) return; done[c.g] = 1;
        var grp = cs.filter(function (x) { return x.g === c.g && x.type === 'button'; }), q = grp.some(function (x) { return HA.ask === x.i; });
        h += '<div class="row"><div class="t"><span>' + esc(c.g) + '</span>' + (q ? '<span class="sub bad">nochmal tippen zum Bestätigen</span>' : '') + '</div><div class="seg">' + grp.map(function (x) { return ctlHtml(x, true); }).join('') + '</div></div>';
        return;
      }
      h += '<div class="row"><div class="t"><span>' + esc(c.t) + '</span>' + (HA.ask === c.i ? '<span class="sub bad">nochmal tippen zum Bestätigen</span>' : '') + '</div>' + ctlHtml(c, false) + '</div>';
    });
    h += '</div>';
  }

  if ((s.infos || []).length) {
    h += '<div class="card"><div class="lbl">Weitere Werte</div><div class="kv">';
    s.infos.forEach(function (i) { h += '<span>' + esc(i.t) + '</span><b>' + esc(i.v) + '</b>'; });
    h += '</div></div>';
  }

  var top = el.scrollTop;
  el.innerHTML = h;
  el.scrollTop = top;
  bind();
  bindChart();
}

function control(i, d) {
  var c = (HA.s.controls || []).filter(function (x) { return x.i === i; })[0];
  if (!c) return;
  if (c.confirm && HA.ask !== i) {
    HA.ask = i; clearTimeout(HA.askT);
    HA.askT = setTimeout(function () { HA.ask = null; render(); }, 4000);
    render(); return;
  }
  HA.ask = null; clearTimeout(HA.askT);
  send('Control', JSON.stringify({ i: i, d: d || 0 }));
  render();
}

function bind() {
  document.querySelectorAll('#ha [data-i]').forEach(function (b) {
    b.onclick = function () { control(Number(b.dataset.i), Number(b.dataset.d || 0)); };
  });
}

window.addEventListener('resize', render);
</script>
