<!-- Layout und Farben kommen aus „Visu Design“ (W5D_GetCSS + W5D_GetTileCSS, Bausteine laut README, ab 1.7).
     Hier nur Sonderelemente (Kopf Soll/Ist, Wochenprogramm, Sollwerte je Betriebsart), ausschließlich mit Farben aus Visu Design. -->
<style>
#hz { gap: 14px; }
/* Kopf: Soll links, Ist rechts (Vorgabe für alle Ansichten) */
#hz .head { flex-direction: row-reverse; align-items: stretch; }
#hz .head.solo .ist { display: none; }
#hz .head.solo { justify-content: flex-end; }   /* row-reverse: flex-end = links */
#hz .head.solo .soll { align-items: flex-start; }
#hz .ist { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 4px; min-width: 0; }
#hz .ist .v { font-size: 44px; font-weight: 300; line-height: 1; letter-spacing: -.01em; }
#hz .ist .v small { font-size: 18px; margin-left: 2px; color: var(--w5t-muted); }
#hz .facts { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; gap: 4px 12px; white-space: normal; }
#hz .facts span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
#hz .facts svg { width: 13px; height: 13px; flex: none; }
#hz .soll { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 6px; }
#hz .ctl { display: flex; align-items: center; gap: 4px; }
#hz .soll .v { font-size: 26px; font-weight: 500; min-width: 76px; text-align: center; }
#hz .mrow { display: flex; align-items: center; gap: 10px; min-height: 40px; }
#hz .mrow .ib { margin-left: auto; }
/* Betriebsart: Visu-Design-Chip ist flex:none/nowrap – hier darf er schrumpfen und umbrechen, sonst schiebt er das Regler-Symbol aus der Kachel */
#hz .mode { white-space: normal; align-self: flex-start; max-width: 100%; min-width: 0; flex: 0 1 auto; }
#hz .mode span:last-child { min-width: 0; overflow-wrap: anywhere; }
#hz .mrow { min-width: 0; max-width: 100%; }
/* nur Sollwert (kein Ist, kein Wochenplan): Bedienung mittig in der Kachel */
body.solo #hz { justify-content: center; align-items: center; }
body.solo #hz .head { justify-content: center; }
body.solo #hz .soll { align-items: center; gap: 10px; }
body.solo #hz .soll .ctl { gap: 14px; }
body.solo #hz .soll .v { font-size: 34px; min-width: 96px; }
body.solo #hz .soll .ib { width: 52px; height: 52px; font-size: 26px; }
/* Sollwerte je Betriebsart */
#hz .sec { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--w5t-line); margin-top: 4px; padding-top: 12px; }
#hz .sp { display: flex; flex-direction: column; gap: 4px; }
#hz .sp + .sp { border-top: 1px solid var(--w5t-line); padding-top: 10px; }
#hz .sp .n { display: flex; align-items: center; gap: 8px; font-weight: 500; }
#hz .sp .badge { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; }
#hz .sp .val { font-size: 20px; font-weight: 500; }
#hz .sp .ctl { gap: 10px; }
#hz .sp .rng { flex: 1; width: auto; min-width: 60px; }
#hz .scale { display: flex; justify-content: space-between; font-size: 10px; padding: 0 50px; }
#hz .scale span { color: var(--w5t-muted); }
/* Wochenprogramm */
#hz .wk { display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 10px; padding: 6px; margin: 0 -6px; touch-action: manipulation; }
#hz .wk:hover, #hz .wk.sel { background: var(--w5t-bg2); }
#hz .wk .d { width: 68px; flex: none; font-size: 13px; }
#hz .wk.today .d { font-weight: 600; color: var(--w5t-accent); }
#hz .wk .chev { width: 16px; height: 16px; flex: none; color: var(--w5t-muted); transition: transform .15s; }
#hz .wk.sel .chev { transform: rotate(90deg); }
#hz .wbar { position: relative; flex: 1; height: 22px; border-radius: 6px; overflow: hidden; background: var(--w5t-bg2); }
#hz .wbar span { position: absolute; top: 0; bottom: 0; }
#hz .wbar i { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--w5t-knob); box-shadow: 0 0 0 1px var(--w5t-shadow); }
#hz .ticks { display: flex; justify-content: space-between; margin: -4px 26px 0 84px; font-size: 10px; }
#hz .ticks span { color: var(--w5t-muted); }
#hz .ed { padding: 4px 0 2px; display: flex; flex-direction: column; gap: 8px; }
#hz .ed .pt { display: flex; align-items: center; gap: 8px; }
#hz .ed input[type=time] { width: 112px; flex: none; }
#hz .tgl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--w5t-muted); }
#hz .btn { align-self: flex-start; }
/* Verlauf (Einstellungsseite) – wie Heizungsanlage Kachel */
#hz .nav { display: flex; align-items: center; gap: 8px; }
#hz .when { flex: 1; text-align: center; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hz .live { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--w5t-accent); padding: 0 6px; }
#hz .plot { position: relative; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; min-height: 130px; margin: 0 34px 0 30px; }
#hz .plot:active { cursor: grabbing; }
#hz .plot .load { height: 130px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--w5t-muted); }
#hz .chart svg { width: 100%; height: 130px; touch-action: pan-y; display: block; overflow: visible; }
#hz .chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
#hz .chart .ln.thin { stroke-width: 1.2; opacity: .8; }
#hz .chart .va { fill: var(--w5t-cold); opacity: .14; }
#hz .chart .gl { stroke: var(--w5t-line); stroke-width: 1; }
#hz .chart .dl { stroke-dasharray: 3 3; }
#hz .chart .cur { stroke: var(--w5t-fg); stroke-width: 1; opacity: .5; }
#hz .yl { position: absolute; top: -6px; bottom: -6px; right: -34px; width: 30px; display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; pointer-events: none; }
#hz .yl.left { right: auto; left: -30px; width: 28px; text-align: right; }
#hz .yl span { color: var(--w5t-muted); }
#hz .yl.left span { color: var(--w5t-cold); }
#hz .tip { position: absolute; top: -6px; display: none; flex-wrap: wrap; gap: 2px 10px; max-width: 100%; font-size: 11px; padding: 5px 8px; border-radius: 8px; background: var(--w5t-bg2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; box-shadow: 0 1px 4px var(--w5t-shadow); z-index: 2; }
#hz .tip b { width: 100%; font-weight: 600; }
#hz .tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
#hz .ax { font-size: 10px; display: flex; justify-content: space-between; line-height: 1.25; margin: 0 34px 0 30px; }
#hz .ax span { text-align: center; color: var(--w5t-muted); }
#hz .ax span:first-child { text-align: left; }
#hz .ax span:last-child { text-align: right; }
#hz .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; }
#hz .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
#hz .legend i.soll { background: repeating-linear-gradient(90deg, var(--w5t-hot) 0 4px, transparent 4px 6px) !important; }
/* schmal (Smartphone) */
@media (max-width: 420px) {
  #hz .ist .v { font-size: 38px; }
  #hz .soll .v { font-size: 22px; min-width: 62px; }
  #hz .wk .d { width: 58px; font-size: 12px; }
  #hz .ticks { margin-left: 74px; }
}
/* kleine Kachel: nur Ist, Soll und Betriebsart */
body.compact #hz .hint { display: none; }
body.compact #hz .ist .v { font-size: 34px; }
body.compact #hz .soll .v { min-width: 0; font-size: 22px; }
/* zugeklappte Kachel mit genug Höhe (z. B. iPhone 2×2): Inhalt mittig, größere Werte und Tasten */
body.closed #hz { justify-content: center; gap: 18px; padding-bottom: 20px; }
body.closed #hz .ist .v { font-size: 48px; }
body.closed #hz .ist .v small { font-size: 20px; }
body.closed #hz .facts { font-size: 13px; }
body.closed #hz .soll .v { font-size: 30px; min-width: 66px; }
body.closed #hz .soll .ib { width: 50px; height: 50px; font-size: 24px; }
body.closed #hz .mode { font-size: 14px; padding: 9px 14px; }
body.closed #hz .mrow .ib { width: 46px; height: 46px; }
/* kleine Kachel nur mit Sollwert: unter dem Titel mittig, ohne Beschriftung */
body.solo.compact #hz { padding-top: 46px; padding-bottom: 8px; }
body.solo.compact #hz .soll .lbl { display: none; }
body.solo.compact #hz .soll .ctl { gap: 18px; }
body.solo.compact #hz .soll .v { font-size: 28px; min-width: 64px; }
body.solo.compact #hz .soll .ib { width: 44px; height: 44px; font-size: 22px; }
@media (max-height: 130px) {
  body.solo.compact #hz { padding-top: 40px; padding-bottom: 4px; }
  body.solo.compact #hz .soll .ib { width: 38px; height: 38px; font-size: 20px; }
  body.solo.compact #hz .soll .v { font-size: 24px; }
}
</style>
<div id="hz" class="w5t fill"></div>
<script>
// open: Wochenprogramm aufgeklappt; null = automatisch nach Kachelhöhe (große Kachel / Vergrößern-Ansicht offen)
var HZ = { s: null, busy: 0, pending: false, edit: null, open: null };
var AUTO_OPEN_H = 480;
/*
 * Mit openObject (Symcon ab 8.2) öffnet das Regler-Symbol das Visu-Fenster des Sollwerts:
 * Regler je Betriebsart und Wochenplan sind dort Unterobjekte. Die kleine Kachel klappt dann nicht auf,
 * große Kacheln (ab 480 px) zeigen weiter alles. Ohne openObject: Aufklappen in der Kachel (Zustand gemerkt).
 */
function canOpenWindow() { return typeof openObject === 'function' && HZ.s && (HZ.s.detailId > 0 || HZ.s.targetId > 0); }
function isOpen() {
  if (HZ.s && HZ.s.alwaysOpen) return true;   // Instanz auf der Einstellungsseite
  if (canOpenWindow()) return window.innerHeight >= AUTO_OPEN_H;
  return HZ.open === null ? window.innerHeight >= AUTO_OPEN_H : HZ.open;
}
window.addEventListener('resize', function () { if (HZ.s && HZ.busy === 0) render(); });
var DAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
var ICON = {
  drop: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.7c-.3 0-.6.1-.8.4C9 6 5 11.2 5 14.9 5 18.8 8.1 22 12 22s7-3.2 7-7.1c0-3.7-4-8.9-6.2-11.8-.2-.3-.5-.4-.8-.4z"/></svg>',
  valve: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M12 4v8M8 4h8M6 12v6h12v-6"/></svg>',
  tune: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
};

/* Farben aus „Visu Design“ live übernehmen (Element #w5d), auch wenn die Visu die Kachel zwischengespeichert hat */
function design(css) {
  if (typeof css !== 'string') return;
  var st = document.getElementById('w5d');
  if (!st) { st = document.createElement('style'); st.id = 'w5d'; (document.head || document.body).appendChild(st); }
  if (st.textContent !== css) st.textContent = css;
}

function handleMessage(data) {
  var m;
  try { m = typeof data === 'string' ? JSON.parse(data) : data; } catch (e) { return; }
  if (m && m.type === 'hist') {            // Antwort auf eine Verlaufsanfrage, nur die eigene übernehmen
    if (m.id !== HV.req) return;
    HV.data = m;
    if (HZ.busy > 0 || HV.drag) { HZ.pending = true; return; }
    render();
    return;
  }
  HZ.s = m;
  design(HZ.s.design);
  // gemerkter Klappzustand vom Modul (gilt nach Neuladen und auf allen Geräten); null = automatisch nach Kachelhöhe
  if (typeof HZ.s.expanded === 'boolean') { if (HZ.open !== HZ.s.expanded && !HZ.s.expanded) HZ.edit = null; HZ.open = HZ.s.expanded; }
  if (HZ.busy > 0 || HV.drag) { HZ.pending = true; return; }
  render();
}

function fmt(v, d) {
  if (v === null || v === undefined || isNaN(v)) return '–';
  return Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function digits() { return HZ.s && HZ.s.step < 1 ? 1 : 0; }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function hm(t) { return pad(Math.floor(t / 60)) + ':' + pad(t % 60); }
function modeById(id) { var m = (HZ.s.modes || []).filter(function (x) { return x.id === id; }); return m[0] || null; }
function dayNames(mask) {
  var r = [];
  for (var i = 0; i < 7; i++) if (mask & (1 << i)) r.push(DAYS[i]);
  if (r.length === 7) return 'Mo–So';
  if (r.length === 5 && (mask & 31) === 31) return 'Mo–Fr';
  if (r.length === 2 && (mask & 96) === 96) return 'Sa, So';
  return r.join(', ');
}
function dow() { return (new Date().getDay() + 6) % 7; }
function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function send(ident, value) { if (typeof requestAction === 'function') requestAction(ident, value); }
function snap(v, m) { var st = HZ.s.step; v = Math.round(v / st) * st; return Math.round(Math.max(m.min, Math.min(m.max, v)) * 100) / 100; }

/* nächster Wechsel der Betriebsart ab jetzt (heute oder an den Folgetagen) */
function nextSwitch() {
  var s = HZ.s, now = nowMin(), d0 = dow();
  for (var k = 0; k < 7; k++) {
    var d = (d0 + k) % 7, best = null;
    (s.groups || []).forEach(function (g) {
      if (!(g.days & (1 << d))) return;
      g.points.forEach(function (p) {
        var t = p.h * 60 + p.m;
        if ((k > 0 || t > now) && p.a !== s.current && (best === null || t < best.t)) best = { t: t, a: p.a, k: k };
      });
    });
    if (best) return best;
  }
  return null;
}

/* Hell/Dunkel übernimmt W5D_GetTileJS (w5tTheme); ohne Design-Modul bleibt der helle Modus */
function theme() { if (typeof w5tTheme === 'function') w5tTheme(); }
/* Spur des Schiebereglers: Füllung in der Farbe der Betriebsart bis zum Wert */
function trk(c, p) { return 'linear-gradient(90deg,' + c + ' ' + p + '%,var(--w5t-line) ' + p + '%)'; }

function render() {
  var s = HZ.s, el = document.getElementById('hz');
  if (!s) return;
  theme();
  document.body.classList.toggle('compact', window.innerHeight < 300);
  var dg = digits(), h = '', cur = modeById(s.current);
  document.body.classList.toggle('solo', !s.hasActual && !s.humidity && s.valve === null && !(s.modes || []).length && !(s.groups || []).length && !s.error);

  // Kopf
  h += '<div class="head' + (s.hasActual || s.humidity || s.valve !== null ? '' : ' solo') + '"><div class="ist">' + (s.hasActual ? '<div class="lbl">Ist</div><div class="v num">' + fmt(s.actual, 1) + '<small>°C</small></div>' : '') + '<div class="facts">';
  if (s.humidity) {
    var hu = s.humidity, tip = 'Sensor ' + fmt(hu.raw, 0) + ' %' + (hu.ts !== null ? ' bei ' + fmt(hu.ts, 1) + ' °C' : '');
    h += '<span title="' + esc(tip) + '">' + ICON.drop + fmt(hu.rh, 0) + ' %</span>';
  }
  if (s.valve !== null) h += '<span>' + ICON.valve + 'Ventil ' + fmt(s.valve, 0) + ' %</span>';
  h += '</div></div>';
  if (s.target) {
    h += '<div class="soll"><div class="lbl">Soll</div><div class="ctl"><button class="ib plain lg" data-t="-1" aria-label="Sollwert senken">−</button>'
      + '<div class="v num" id="tv">' + fmt(s.target.v, dg) + '°</div><button class="ib plain lg" data-t="1" aria-label="Sollwert erhöhen">+</button></div></div>';
  }
  h += '</div>';

  if (s.error) { el.innerHTML = h + '<div class="hint">' + esc(s.error) + '</div>'; bind(); return; }

  var hasPlan = (s.modes || []).length || (s.groups || []).length;
  h += '<div class="mrow">';
  if (cur) {
    var nx = s.active ? nextSwitch() : null, txt = esc(cur.name);
    if (!s.active) txt += ' · Wochenplan aus';
    else if (nx) { var nm = modeById(nx.a); txt += ' bis ' + (nx.k === 1 ? 'morgen ' : nx.k > 1 ? DAYS[(dow() + nx.k) % 7] + ' ' : '') + hm(nx.t) + (nm ? ', dann ' + esc(nm.name) : ''); }
    h += '<div class="chip mode"><span class="dot sm" style="background:' + cur.color + '"></span><span>' + txt + '</span></div>';
  }
  // Wochenprogramm wird nur zum Einstellen gebraucht: über das Regler-Symbol aufklappen (wie Klang in der Sonos-Kachel)
  // Regler-Symbol: öffnet das Fenster mit Sollwerten und Wochenplan (bzw. klappt ohne openObject auf); in großen Kacheln ist alles sichtbar
  var win = canOpenWindow();
  // Einstellungsseite: aktives Regler-Symbol = schließen, zurück zur Raumseite
  if (s.alwaysOpen && s.backId > 0 && typeof openObject === 'function') h += '<button class="ib" id="back" aria-label="Schließen, zurück zum Raum" title="Schließen">' + ICON.tune + '</button>';
  if (hasPlan && !s.alwaysOpen && !(win && isOpen())) h += '<button class="ib' + (!win && isOpen() ? '' : ' plain') + '" id="more" aria-expanded="' + isOpen() + '" title="Wochenprogramm und Sollwerte">' + ICON.tune + '</button>';
  h += '</div>';

  // ohne Wochenplan oder zugeklappt nur Ist, Soll und Betriebsart
  if (!hasPlan || !isOpen()) { el.innerHTML = h; bind(); return; }

  // Wochenprogramm mit Schaltpunkten, darunter die Sollwerte je Betriebsart
  var tb = 1 << dow(), nm2 = nowMin();
  h += '<div class="card"><div class="row"><span class="lbl">Wochenprogramm</span><span class="tgl">' + (s.active ? 'aktiv' : 'aus') + '<button class="tg' + (s.active ? ' on' : '') + '" id="act" aria-label="Wochenplan ein/aus"></button></span></div>';
  (s.groups || []).forEach(function (g) {
    var today = (g.days & tb) !== 0;
    h += '<div class="wk' + (today ? ' today' : '') + (HZ.edit === g.id ? ' sel' : '') + '" data-g="' + g.id + '"><div class="d">' + dayNames(g.days) + '</div><div class="wbar">';
    var pts = g.points, last = pts.length ? pts[pts.length - 1].a : 0;
    var start = 0, act = (pts.length && pts[0].h === 0 && pts[0].m === 0) ? pts[0].a : last;
    pts.concat([{ h: 24, m: 0, a: null }]).forEach(function (p) {
      var t = p.h * 60 + p.m, mm = modeById(act);
      if (t > start) h += '<span style="left:' + (start / 14.4) + '%;width:' + ((t - start) / 14.4) + '%;background:' + (mm ? mm.color : 'transparent') + '" title="' + hm(start) + ' ' + (mm ? esc(mm.name) : '') + '"></span>';
      start = t; if (p.a !== null) act = p.a;
    });
    if (today) h += '<i style="left:calc(' + (nm2 / 14.4) + '% - 1px)"></i>';
    h += '</div>' + ICON.chev + '</div>';
    if (HZ.edit === g.id) {
      h += '<div class="ed">';
      g.points.forEach(function (p) {
        h += '<div class="pt"><input class="in" type="time" step="60" value="' + pad(p.h) + ':' + pad(p.m) + '" data-g="' + g.id + '" data-p="' + p.id + '" data-a="' + p.a + '"><select class="in" data-g="' + g.id + '" data-p="' + p.id + '">';
        (s.modes || []).forEach(function (m) { h += '<option value="' + m.id + '"' + (m.id === p.a ? ' selected' : '') + '>' + esc(m.name) + '</option>'; });
        h += '</select><button class="ib ghost" data-del="' + p.id + '" data-g="' + g.id + '" aria-label="Schaltpunkt löschen">✕</button></div>';
      });
      h += '<button class="btn acc" data-add="' + g.id + '">+ Schaltpunkt</button></div>';
    }
  });
  h += '<div class="ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>';

  h += '<div class="sec"><div class="row"><span class="lbl">Sollwerte</span></div>';
  (s.modes || []).forEach(function (m) {
    if (m.v === null) return;
    var p = (m.v - m.min) / (m.max - m.min) * 100;
    h += '<div class="sp"><div class="row"><div class="n"><span class="dot" style="background:' + m.color + '"></span>' + esc(m.name)
      + (m.id === s.current && s.active ? ' <span class="badge" style="background:' + m.color + '">aktiv</span>' : '') + '</div>'
      + '<div class="val num" id="mv' + m.id + '">' + fmt(m.v, dg) + ' °C</div></div>'
      + '<div class="ctl"><button class="ib plain" data-ms="-1" data-m="' + m.id + '" aria-label="' + esc(m.name) + ' senken">−</button>'
      + '<input class="rng" type="range" data-m="' + m.id + '" min="' + m.min + '" max="' + m.max + '" step="' + s.step + '" value="' + m.v + '" style="--tr:' + trk(m.color, p) + ';--th:' + m.color + '" aria-label="' + esc(m.name) + '">'
      + '<button class="ib plain" data-ms="1" data-m="' + m.id + '" aria-label="' + esc(m.name) + ' erhöhen">+</button></div></div>';
  });
  var m0 = (s.modes || []).filter(function (m) { return m.v !== null; })[0];
  if (m0) h += '<div class="scale"><span>' + fmt(m0.min, 0) + '°</span><span>' + fmt(m0.max, 0) + '°</span></div>';
  h += '</div></div>';
  if (s.alwaysOpen) h += chartCard();      // Verlauf nur auf der Einstellungsseite
  h += '<div class="hint">Tageszeile antippen, um Schaltpunkte zu bearbeiten. Die Sollwertverstellung oben gilt bis zum nächsten Schaltpunkt.</div>';

  el.innerHTML = h;
  bind();
  if (s.alwaysOpen) bindChart();
}

/* ---------- Verlauf (Einstellungsseite): verschiebbar, Zeitraum wählbar, Werte mit Datum und Uhrzeit ---------- */
var WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
var SPANS = [[21600, '6 h'], [86400, '24 h'], [259200, '3 T'], [604800, '7 T']];
var COL = { soll: 'var(--w5t-hot)', ist: 'var(--w5t-fg)', ventil: 'var(--w5t-cold)' }, NAME = { soll: 'Soll', ist: 'Ist', ventil: 'Ventil' };
// end null = live (bis jetzt); data = Antwort auf die eigene Anfrage (req)
var HV = { end: null, span: 86400, data: null, req: null, drag: null, plot: null, timer: null };

function nowS() { return Math.floor(Date.now() / 1000); }
function dt(ts, withDay) { var d = new Date(ts * 1000); return (withDay ? WD[d.getDay()] + ' ' : '') + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '. ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function viewEnd() { return HV.end === null ? nowS() : HV.end; }
function loadHist() {
  var id = Math.random().toString(36).slice(2, 10), to = viewEnd();
  HV.req = id;
  send('History', JSON.stringify({ id: id, from: to - HV.span, to: to }));
}
function setView(end, span) {
  if (span) HV.span = span;
  if (end !== null && end >= nowS() - 120) end = null;   // bis jetzt = live
  HV.end = end; HV.data = null;
  loadHist();
  render();
}
/* Stufenlinie: Wert gilt bis zum nächsten Punkt */
function stepPts(pts, x, y) {
  var o = [];
  pts.forEach(function (p, i) { if (i) o.push(x(p[0]) + ',' + y(pts[i - 1][1])); o.push(x(p[0]) + ',' + y(p[1])); });
  return o.join(' ');
}
function chartCard() {
  if (!HV.data && !HV.req) loadHist();
  if (!HV.timer) HV.timer = setInterval(function () { if (HV.end === null && !HV.drag && HZ.busy === 0) loadHist(); }, 300000);
  var d = HV.data, se = d ? d.series || {} : {}, to = d ? d.to : viewEnd(), from = d ? d.from : to - HV.span, span = to - from;
  var keys = ['soll', 'ist', 'ventil'].filter(function (k) { return se[k] && se[k].length > 1; });
  var h = '<div class="card chart"><div class="row"><span class="lbl">Verlauf</span><span class="seg sm">';
  SPANS.forEach(function (x) { h += '<button class="' + (HV.span === x[0] ? 'on' : '') + '" data-span="' + x[0] + '">' + x[1] + '</button>'; });
  h += '</span></div><div class="nav"><button class="ib plain sm" data-nav="-1" aria-label="zurück">‹</button><span class="when num" id="rng">' + dt(from, true) + ' – ' + dt(to, false) + '</span>'
    + '<button class="ib plain sm" data-nav="1" aria-label="vor"' + (HV.end === null ? ' disabled' : '') + '>›</button>'
    + (HV.end === null ? '<span class="live">live</span>' : '<button class="btn acc sm" data-nav="0">Jetzt</button>') + '</div>';
  h += '<div class="plot" id="plot">';
  HV.plot = null;
  if (!d) h += '<div class="load">lädt …</div>';
  else if (!keys.length) h += '<div class="load">keine Daten im Zeitraum</div>';
  else {
    // Temperaturachse (Soll, Ist) in 1-K-Schritten, mindestens 4 K; Ventil 0–100 % auf eigener Achse links
    var lo = 1e9, hi = -1e9;
    ['soll', 'ist'].forEach(function (k) { (se[k] || []).forEach(function (p) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }); });
    if (lo > hi) { lo = 15; hi = 25; }
    lo = Math.floor(lo - 0.5); hi = Math.ceil(hi + 0.5); if (hi - lo < 4) hi = lo + 4;
    var W = 300, H = 120, x = function (t) { return ((t - from) / span * W).toFixed(2); };
    var y = function (v) { return (H - (v - lo) / (hi - lo) * H).toFixed(1); }, yv = function (v) { return (H - v / 100 * H).toFixed(1); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
    for (var g = 0; g <= 4; g++) svg += '<line class="gl" x1="0" x2="' + W + '" y1="' + (H * g / 4) + '" y2="' + (H * g / 4) + '" vector-effect="non-scaling-stroke"/>';
    svg += '<g id="pl">';
    var md = new Date(from * 1000); md.setHours(24, 0, 0, 0);
    for (var t = md.getTime() / 1000; t < to; t += 86400) svg += '<line class="gl dl" x1="' + x(t) + '" x2="' + x(t) + '" y1="0" y2="' + H + '" vector-effect="non-scaling-stroke"/>';
    if (se.ventil && se.ventil.length > 1) {
      var vp = stepPts(se.ventil, x, yv);
      svg += '<polygon class="va" points="' + x(se.ventil[0][0]) + ',' + H + ' ' + vp + ' ' + x(se.ventil[se.ventil.length - 1][0]) + ',' + H + '"/>'
        + '<polyline class="ln thin" points="' + vp + '" stroke="' + COL.ventil + '" vector-effect="non-scaling-stroke"/>';
    }
    if (se.soll && se.soll.length > 1) svg += '<polyline class="ln" points="' + stepPts(se.soll, x, y) + '" stroke="' + COL.soll + '" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"/>';
    if (se.ist && se.ist.length > 1) svg += '<polyline class="ln" points="' + se.ist.map(function (p) { return x(p[0]) + ',' + y(p[1]); }).join(' ') + '" stroke="' + COL.ist + '" vector-effect="non-scaling-stroke"/>';
    svg += '</g><line id="cur" class="cur" style="display:none" x1="0" x2="0" y1="0" y2="' + H + '" vector-effect="non-scaling-stroke"/></svg>';
    h += svg + '<div class="yl"><span>' + hi + '°</span><span>' + lo + '°</span></div>';
    if (se.ventil) h += '<div class="yl left"><span>100 %</span><span>0 %</span></div>';
    h += '<div class="tip" id="tip"></div>';
    HV.plot = { from: from, to: to, se: se, keys: keys };
  }
  h += '</div><div class="ax">';
  for (var i = 0; i <= 4; i++) { var ts = from + span * i / 4, dd = new Date(ts * 1000); h += '<span>' + WD[dd.getDay()] + ' ' + pad(dd.getDate()) + '.' + pad(dd.getMonth() + 1) + '.<br>' + pad(dd.getHours()) + ':' + pad(dd.getMinutes()) + '</span>'; }
  h += '</div><div class="legend">';
  keys.forEach(function (k) { h += '<span><i class="' + k + '" style="background:' + COL[k] + '"></i>' + NAME[k] + (k === 'ventil' ? ' %' : '') + '</span>'; });
  return h + '</div></div>';
}
/* Werte am Zeitpunkt der Zeigerposition (Soll/Ventil: letzter Wert davor, Ist: nächster Wert) */
function valAt(pts, t, step) {
  var best = null;
  pts.forEach(function (p) { if (step) { if (p[0] <= t) best = p; } else if (best === null || Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p; });
  return best;
}
function tip(px) {
  var P = HV.plot, el = document.getElementById('plot'), tp = document.getElementById('tip'), cur = document.getElementById('cur');
  if (!P || !el || !tp) return;
  var r = el.getBoundingClientRect(), f = Math.max(0, Math.min(1, (px - r.left) / r.width)), t = P.from + f * (P.to - P.from), txt = '<b>' + dt(t, true) + '</b>';
  P.keys.forEach(function (k) {
    var b = valAt(P.se[k], t, k !== 'ist');
    if (b) txt += '<span><i style="background:' + COL[k] + '"></i>' + NAME[k] + ' ' + (k === 'ventil' ? fmt(b[1], 0) + ' %' : fmt(b[1], 1) + '°') + '</span>';
  });
  tp.innerHTML = txt; tp.style.display = 'flex';
  tp.style.left = Math.min(Math.max(0, f * r.width - tp.offsetWidth / 2), r.width - tp.offsetWidth) + 'px';
  cur.setAttribute('x1', (f * 300).toFixed(2)); cur.setAttribute('x2', (f * 300).toFixed(2)); cur.style.display = '';
}
function untip() { var tp = document.getElementById('tip'), cur = document.getElementById('cur'); if (tp) tp.style.display = 'none'; if (cur) cur.style.display = 'none'; }
function bindChart() {
  document.querySelectorAll('#hz [data-span]').forEach(function (b) {
    b.onclick = function () { setView(HV.end, Number(b.dataset.span)); };
  });
  document.querySelectorAll('#hz [data-nav]').forEach(function (b) {
    b.onclick = function () { var n = Number(b.dataset.nav); if (n === 0) setView(null); else setView(viewEnd() + n * HV.span / 2); };
  });
  var pl = document.getElementById('plot');
  if (!pl || !HV.plot) return;
  pl.addEventListener('pointerdown', function (e) {
    HV.drag = { x: e.clientX, end: HV.plot.to, w: pl.getBoundingClientRect().width, moved: false };
    try { pl.setPointerCapture(e.pointerId); } catch (x) { /* */ }
  });
  pl.addEventListener('pointermove', function (e) {
    var D = HV.drag;
    if (!D) { if (e.pointerType === 'mouse') tip(e.clientX); return; }
    var dx = e.clientX - D.x;
    if (!D.moved && Math.abs(dx) < 8) return;
    D.moved = true; untip();
    var span = HV.plot.to - HV.plot.from, end = Math.min(nowS(), D.end - dx / D.w * span);
    dx = (D.end - end) / span * D.w;   // nicht über „jetzt“ hinaus
    document.getElementById('pl').setAttribute('transform', 'translate(' + (dx / D.w * 300).toFixed(2) + ',0)');
    document.getElementById('rng').textContent = dt(end - span, true) + ' – ' + dt(end, false);
  });
  function up(e) {
    var D = HV.drag; HV.drag = null;
    if (!D) return;
    if (!D.moved) { tip(e.clientX); return; }
    var span = HV.plot.to - HV.plot.from;
    setView(Math.round(Math.min(nowS(), D.end - (e.clientX - D.x) / D.w * span)));
  }
  pl.addEventListener('pointerup', up);
  pl.addEventListener('pointercancel', function () { HV.drag = null; render(); });
  pl.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !HV.drag) untip(); });
}

function hold() { HZ.busy++; }
function release() { HZ.busy = Math.max(0, HZ.busy - 1); if (HZ.busy === 0 && HZ.pending) { HZ.pending = false; render(); } }

/* Regler einer Betriebsart sichtbar setzen */
function showMode(id, v) {
  var m = modeById(id), r = document.querySelector('input[type=range][data-m="' + id + '"]');
  if (r) { r.value = v; r.style.setProperty('--tr', trk(m.color, (v - m.min) / (m.max - m.min) * 100)); }
  document.getElementById('mv' + id).textContent = fmt(v, digits()) + ' °C';
}

function bind() {
  var s = HZ.s;
  // zugeklappt (kein Wochenprogramm-Kasten), nicht nur Sollwert, genug Höhe: großzügigere Anordnung
  document.body.classList.toggle('closed', !document.querySelector('.card') && !document.body.classList.contains('solo') && !s.error && window.innerHeight >= 230);
  var bk = document.getElementById('back');
  if (bk) bk.onclick = function () { try { openObject(s.backId); } catch (e) { /* nichts */ } };
  var mo = document.getElementById('more');
  if (mo) mo.onclick = function () {
    if (canOpenWindow()) {
      // bevorzugt die Einstellungsseite (Kategorie mit der Kachel „immer offen“), sonst das Visu-Fenster des Sollwerts
      try { openObject(s.detailId > 0 ? s.detailId : s.targetId); return; } catch (e) { /* sonst in der Kachel aufklappen */ }
    }
    HZ.open = !isOpen();
    if (!HZ.open) HZ.edit = null;
    HZ.s.expanded = HZ.open;
    send('SetExpanded', HZ.open);   // Zustand im Modul merken
    render();
    var c = HZ.open && document.querySelector('.card');
    // nur innerhalb der Kachel scrollen (scrollIntoView würde auch die Visu um die Kachel herum verschieben)
    if (c) { var hz = document.getElementById('hz'); hz.scrollTo({ top: Math.max(0, c.offsetTop - 8), behavior: 'smooth' }); }
  };
  document.querySelectorAll('button[data-t]').forEach(function (b) {
    b.onclick = function () {
      var v = snap(s.target.v + Number(b.dataset.t) * s.step, s.target);
      if (v === s.target.v) return;
      s.target.v = v; document.getElementById('tv').textContent = fmt(v, digits()) + '°';
      send('SetTarget', v);
    };
  });
  document.querySelectorAll('button[data-ms]').forEach(function (b) {
    b.onclick = function () {
      var id = Number(b.dataset.m), m = modeById(id), v = snap(m.v + Number(b.dataset.ms) * s.step, m);
      if (v === m.v) return;
      m.v = v; showMode(id, v);
      send('SetMode', JSON.stringify({ a: id, v: v }));
    };
  });
  document.querySelectorAll('input[type=range][data-m]').forEach(function (r) {
    var id = Number(r.dataset.m);
    r.addEventListener('pointerdown', function () { if (!HZ.drag) { HZ.drag = true; hold(); } });
    r.addEventListener('input', function () { showMode(id, Number(r.value)); });
    r.addEventListener('change', function () {
      var m = modeById(id), v = Number(r.value);
      if (v !== m.v) { m.v = v; send('SetMode', JSON.stringify({ a: id, v: v })); }
    });
  });
  var act = document.getElementById('act');
  if (act) act.onclick = function () { send('SetActive', !s.active); };
  document.querySelectorAll('.wk[data-g]').forEach(function (w) {
    w.onclick = function () { var g = Number(w.dataset.g); HZ.edit = HZ.edit === g ? null : g; render(); };
  });
  document.querySelectorAll('.ed input[type=time]').forEach(function (t) {
    t.addEventListener('focus', hold);
    t.addEventListener('blur', function () {
      var v = t.value.split(':');
      if (v.length >= 2 && t.value !== t.defaultValue) send('SetPoint', JSON.stringify({ g: Number(t.dataset.g), p: Number(t.dataset.p), h: Number(v[0]), m: Number(v[1]), a: Number(t.dataset.a) }));
      release();
    });
  });
  document.querySelectorAll('.ed select').forEach(function (sel) {
    sel.onchange = function () {
      var t = sel.parentNode.querySelector('input[type=time]').value.split(':');
      send('SetPoint', JSON.stringify({ g: Number(sel.dataset.g), p: Number(sel.dataset.p), h: Number(t[0]), m: Number(t[1]), a: Number(sel.value) }));
    };
  });
  document.querySelectorAll('[data-del]').forEach(function (b) {
    b.onclick = function () { send('DeletePoint', JSON.stringify({ g: Number(b.dataset.g), p: Number(b.dataset.del) })); };
  });
  document.querySelectorAll('[data-add]').forEach(function (b) {
    b.onclick = function () {
      var a = (s.modes && s.modes.length) ? s.modes[0].id : 0, d = new Date();
      send('SetPoint', JSON.stringify({ g: Number(b.dataset.add), p: -1, h: d.getHours(), m: 0, a: a }));
    };
  });
}

/* Ende des Ziehens am Schieberegler (auch außerhalb des Reglers losgelassen) */
['pointerup', 'pointercancel'].forEach(function (ev) {
  document.addEventListener(ev, function () { if (HZ.drag) { HZ.drag = false; setTimeout(release, 80); } });
});
window.addEventListener('resize', function () { if (HZ.busy === 0) render(); });
setInterval(function () { if (HZ.busy === 0) render(); }, 60000);
</script>
